services:
  # 1. 백엔드 서비스 설정
  backend:
    build:
      context: ./abiswallow  # abiswallow 폴더 안에 있는 Dockerfile을 사용해 빌드
    ports:
      - "8000:8000"          # 내 컴퓨터의 8000번 포트와 컨테이너의 8000번 포트 연결
    volumes:
      - ./abiswallow:/app    # 코드를 수정하면 컨테이너에도 바로 반영되도록 연동
    env_file:
      - ./abiswallow/.env    # 백엔드 환경변수 파일 로드

  # 2. n8n 워크플로우 자동화 서비스
  n8n:
    image: n8nio/n8n
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/

  # 3. 프론트엔드 서비스 설정
  frontend:
    build:
      context: ./www         # www 폴더 안에 있는 Dockerfile을 사용해 빌드
    ports:
      - "3000:3000"          # 내 컴퓨터의 3000번 포트와 컨테이너의 3000번 포트 연결
    volumes:
      - ./www:/app                                    # 코드를 수정하면 컨테이너에도 바로 반영되도록 연동
      - /app/v0-titanic-qa-app/node_modules           # 컨테이너 안의 node_modules는 내 컴퓨터가 덮어쓰지 않게 보호
    env_file:
      - ./www/.env.local     # 프론트엔드 환경변수 파일 로드

volumes:
  n8n_data:
